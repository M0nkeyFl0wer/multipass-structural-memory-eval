[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-eval"
version = "0.0.1"
description = "Structural Memory Evaluation: a benchmark framework that tests what a memory system knows about its own structure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ben West" },
]
keywords = ["knowledge-graph", "rag", "memory", "benchmark", "topology", "evaluation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "networkx>=3.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
topology = [
    "ripser>=0.6",
    # NOTE: community detection uses networkx's native
    # `louvain_communities` (nx>=3.2, already a core dep), NOT the
    # `python-louvain`/`community` package. Do not re-add python-louvain:
    # `community.best_partition` has different default resolution and
    # tie-breaking, so a reviewer running it would get different
    # communities than the modularity numbers SME reports.
]
viz = [
    "matplotlib>=3.8",
    "pyvis>=0.3",
]
# The LadybugDB Python binding. Originally `real_ladybug` (0.15.3 = storage
# version 40), renamed `ladybug` (0.17.x = storage version 41, now on PyPI —
# what vault-rag writes). The adapter imports `ladybug` first, falls back to
# `real_ladybug`. PIN `ladybug>=0.17` (2026-06-24): leaving this on the legacy
# v40 name silently downgraded a venv rebuild to a reader that can't open the
# v41 graph — `vault-rag-sme.service` was blind ~9 nights because the upgrade
# lived as a manual `pip install`, not a constraint here. Constraint, not memory.
#
# CEILING RAISED to <0.19 (2026-08-21). The old <0.18 ceiling assumed a
# storage-version bump would break reads. It does not: 0.18.0 is storage
# version 42 and reads v41 graphs fine. Verified against the live 185K-entity
# vault-rag snapshot (vault-rag-sme.service, exit 0 in 53 s) and the full
# suite (533 passed, 0 ladybug-related skips). The floor is what matters —
# it is the v40 reader that cannot open these graphs, not the newer engine.
# SME only ever opens read_only=True, and only against a snapshot copy, so a
# newer engine can never upgrade-in-place the graph vault-rag writes.
#
# Do NOT co-install `real_ladybug` alongside `ladybug`. Importing both into
# one process segfaults (SIGSEGV) deterministically, in either order. The
# adapter's try/except ladder imports `ladybug` first so it never touches
# both — but with `real_ladybug` present, any ladybug import failure falls
# through to a v40 reader instead of raising. A clean ImportError is the
# better failure: it is loud, and it is the one this pin exists to force.
ladybugdb = [
    "ladybug>=0.17,<0.19",
]
neo4j = [
    "neo4j>=5.0",
]
latency = [
    "hdrhistogram>=0.10",
]
anthropic = [
    "anthropic>=0.40",
]
openai = [
    "openai>=1.40",
]
# [all] keeps the *infra* extras only — topology, viz, graph-db
# bindings (including latency's hdrhistogram). LLM-provider SDKs
# (anthropic, openai) stay opt-in: most users running SME against
# their own graph never need them, and they pull in a non-trivial
# dependency tree. Install explicitly via
# `pip install sme-eval[anthropic,openai]` when you need them.
all = [
    "sme-eval[topology,viz,ladybugdb,neo4j,latency]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    # test-only: the Cat 8f SHACL ValidationReport conformance test
    # parses the emitted report through a real JSON-LD/RDF reader. NOT a
    # runtime dep — SME never projects to RDF or runs a SHACL engine.
    "rdflib>=7.0",
]

[project.scripts]
sme-eval = "sme.cli:main"

[project.urls]
Repository = "https://github.com/M0nkeyFl0wer/multipass-structural-memory-eval"
Issues = "https://github.com/M0nkeyFl0wer/multipass-structural-memory-eval/issues"

[tool.setuptools.packages.find]
include = ["sme*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that call live LLM APIs and should be skipped in fast CI runs",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Reference build utilities preserved for reproducibility (see
# tools/good-dog-graph-pipeline/README.md) — terse one-off scripts, not
# maintained library code; excluded from lint by design.
extend-exclude = ["tools/good-dog-graph-pipeline/scripts"]
